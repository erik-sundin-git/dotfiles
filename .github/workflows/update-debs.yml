name: update-debs

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-debs

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # update-debs updates what it can and exits non-zero if any package
      # failed; open the PR for the rest, then fail the job at the end.
      - name: Refresh source.json files
        id: update
        run: |
          set +e
          changes=$(nix run .#update-debs)
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "changes<<$delim"
            echo "$changes"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Build changed packages
        if: steps.update.outputs.changes != ''
        run: |
          for pkg in $(git diff --name-only -- nix/packages | cut -d/ -f3 | sort -u); do
            nix build ".#$pkg" --no-link -L
          done

      - name: Open pull request
        if: steps.update.outputs.changes != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-debs
          delete-branch: true
          commit-message: |
            packages: update .deb sources

            ${{ steps.update.outputs.changes }}
          title: "packages: update .deb sources"
          body: ${{ steps.update.outputs.changes }}

      - name: Fail if a package could not be updated
        if: steps.update.outputs.status != '0'
        run: |
          echo "update-debs failed for at least one package; see the 'Refresh source.json files' log."
          exit 1
