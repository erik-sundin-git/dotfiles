name: build

# Evaluation can't see build breakage (a hash mismatch, a package that no
# longer builds); this builds one real host weekly. wisp: the smallest
# closure, so it fits a runner's disk.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  wisp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Check and stub the encrypted secrets
        run: .github/ci/stub-secrets.sh

      - name: Build wisp
        run: nix build --no-link .#nixosConfigurations.wisp.config.system.build.toplevel
