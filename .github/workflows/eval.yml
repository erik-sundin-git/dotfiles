name: eval

on:
  # Branches get checked through their PR; pushing to one ran it twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Check and stub the encrypted secrets
        run: .github/ci/stub-secrets.sh

      - name: Evaluate every host
        run: nix flake check --no-build

      - name: Lint (deadnix)
        run: nix build --no-link .#checks.x86_64-linux.deadnix

      # Builds the live ISO's installer, which runs its unit tests
      - name: Build install-host
        run: nix build .#install-host
