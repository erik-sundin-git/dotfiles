name: eval

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # No git-crypt key in CI (public repo, and the key can't be rotated):
      # swap each still-encrypted secrets file for its stub. The dirty tracked
      # files are what the flake evaluates.
      - name: Stub the encrypted secrets
        run: |
          for name in hosts mail; do
            if cmp -s -n 10 <(printf '\0GITCRYPT\0') "nix/secrets/$name.nix"; then
              cp ".github/ci/$name-stub.nix" "nix/secrets/$name.nix"
            fi
          done

      - name: Evaluate every host
        run: nix flake check --no-build

      # Builds the live ISO's installer, which runs its unit tests
      - name: Build install-host
        run: nix build .#install-host
