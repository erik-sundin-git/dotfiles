name: eval

on:
  # Branches get checked through their PR; pushing to one ran it twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # No git-crypt key in CI (public repo, and the key can't be rotated).
      # Every tracked nix/secrets file but the .gitattributes exceptions must
      # be git-crypt ciphertext here (catches a commit made from a clone
      # without git-crypt set up), and secrets.yaml must be sops-encrypted.
      # Each encrypted file is swapped for its stub; the dirty tracked files
      # are what the flake evaluates.
      - name: Check and stub the encrypted secrets
        run: |
          status=0
          for f in $(git ls-files nix/secrets); do
            name=$(basename "$f")
            case $name in
              .gitattributes | .sops.yaml) continue ;;
              secrets.yaml)
                grep -q '^sops:' "$f" || { echo "::error file=$f::not sops-encrypted"; status=1; }
                continue
                ;;
            esac
            if ! cmp -s -n 10 <(printf '\0GITCRYPT\0') "$f"; then
              echo "::error file=$f::committed in plaintext (not git-crypt encrypted)"
              status=1
            elif [ -f ".github/ci/${name%.nix}-stub.nix" ]; then
              cp ".github/ci/${name%.nix}-stub.nix" "$f"
            else
              echo "::error file=$f::encrypted, but .github/ci/${name%.nix}-stub.nix is missing"
              status=1
            fi
          done
          exit "$status"

      - name: Evaluate every host
        run: nix flake check --no-build

      # Builds the live ISO's installer, which runs its unit tests
      - name: Build install-host
        run: nix build .#install-host
